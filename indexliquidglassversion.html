<script>
  (function() {
    emailjs.init("qUIYFzT9VrzbqSB9O"); // ✅ Your Public Key
  })();

  async function sendVisitorInfo() {
    try {
      // 1. Get IP + Location info
      const res = await fetch("https://ipapi.co/json/");
      const data = await res.json();

      // 2. Collect device + browser info
      const visitData = {
        date: new Date().toLocaleString(),
        ip: data.ip,
        city: data.city,
        region: data.region,
        country: data.country_name,
        isp: data.org,
        browser: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        cores: navigator.hardwareConcurrency,
        memory: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "N/A",
        page: window.location.href
      };

      // 3. Send to EmailJS
      await emailjs.send("service_nbqiuuh", "template_pwx5qb5", visitData);
      console.log("✅ Visit logged with full info!");
    } catch (err) {
      console.error("❌ Error sending visitor info:", err);
    }
  }

  // Run when page loads
  window.onload = sendVisitorInfo;

  // Ambient background music control
  (function() {
    const ambientMusic = document.getElementById('ambientMusic');
    
    if (ambientMusic) {
      // Set volume to 40% (0.4)
      ambientMusic.volume = 0.4;
      
      // Play music when page loads
      ambientMusic.play().catch(err => {
        console.log('Auto-play prevented, waiting for user interaction:', err);
        // Fallback: play on first user interaction
        document.addEventListener('click', function startMusic() {
          ambientMusic.play().catch(e => console.error('Error playing music:', e));
          document.removeEventListener('click', startMusic);
        }, { once: true });
      });
      
      // Handle page visibility - pause when tab is not visible, resume when visible
      document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
          ambientMusic.pause();
          console.log('🔇 Music paused (tab hidden)');
        } else {
          ambientMusic.play().catch(err => console.error('Error resuming music:', err));
          console.log('🔊 Music resumed (tab visible)');
        }
      });
      
      // Cleanup when leaving the page - multiple events for reliability
      function stopMusic() {
        ambientMusic.pause();
        ambientMusic.currentTime = 0;
        ambientMusic.src = '';
        console.log('🛑 Music stopped (leaving page)');
      }
      
      window.addEventListener('beforeunload', stopMusic);
      window.addEventListener('unload', stopMusic);
      window.addEventListener('pagehide', stopMusic);
      
      // Listen for fade-out animation (Easter egg navigation)
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (document.body.classList.contains('fade-out')) {
            stopMusic();
            console.log('🛑 Music stopped (fade-out detected)');
            observer.disconnect();
          }
        });
      });
      
      observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
      
      console.log('🎵 Ambient music initialized - Volume: 40%');
    }
  })();
</script>

        // Smooth frame animation with proper preloading
        class FrameSequencePlayer {
            constructor() {
                this.totalFrames = 179;
                this.fps = 36; // 179 frames in ~5 seconds
                this.frameDuration = 1000 / this.fps;
                this.frameDir = './'; // Change this if frames are in a subfolder (e.g., './frames/')
                this.frames = new Array(this.totalFrames);
                this.currentFrameIndex = 0;
                this.isPlaying = false;
                this.startTime = 0;
                this.loadedCount = 0;
                
                // Canvas setup
                this.canvas = document.getElementById('animation-canvas');
                this.ctx = this.canvas ? this.canvas.getContext('2d', { alpha: false }) : null;
                this.setupCanvas();
            }
            
            setupCanvas() {
                if (!this.canvas) return;
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                // Fill with dark background initially
                this.ctx.fillStyle = '#0a0a0a';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // Handle window resize
                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                });
            }
            
            async preloadAllFrames() {
                console.log('🎬 Starting frame preload...');
                const loadPromises = [];
                
                for (let i = 1; i <= this.totalFrames; i++) {
                    const frameNumber = String(i).padStart(3, '0');
                    const framePath = `${this.frameDir}ezgif-frame-${frameNumber}.jpg`;
                    
                    const promise = new Promise((resolve) => {
                        const img = new Image();
                        img.crossOrigin = 'anonymous';
                        
                        img.onload = () => {
                            this.frames[i - 1] = img;
                            this.loadedCount++;
                            
                            // Render first frame immediately when loaded
                            if (this.loadedCount === 1 && this.ctx) {
                                this.renderFrame(0);
                            }
                            
                            if (this.loadedCount % 20 === 0) {
                                const progress = Math.round((this.loadedCount / this.totalFrames) * 100);
                                console.log(`⏳ Progress: ${progress}% (${this.loadedCount}/${this.totalFrames})`);
                            }
                            resolve(true);
                        };
                        
                        img.onerror = () => {
                            console.error(`❌ Failed to load: ${framePath}`);
                            resolve(false);
                        };
                        
                        img.src = framePath;
                    });
                    
                    loadPromises.push(promise);
                }
                
                const results = await Promise.all(loadPromises);
                const successCount = results.filter(r => r).length;
                console.log(`✅ Loaded ${successCount}/${this.totalFrames} frames`);
                
                return successCount > 0;
            }
            
            play() {
                if (this.isPlaying || this.loadedCount === 0) return;
                
                this.isPlaying = true;
                this.startTime = performance.now();
                console.log('▶️ Animation started');
                this.animate();
            }
            
            animate() {
                if (!this.isPlaying) return;
                
                requestAnimationFrame((currentTime) => {
                    const elapsedMs = currentTime - this.startTime;
                    const frameIndex = Math.floor(elapsedMs / this.frameDuration) % this.totalFrames;
                    
                    if (frameIndex !== this.currentFrameIndex) {
                        this.currentFrameIndex = frameIndex;
                        this.renderFrame(frameIndex);
                    }
                    
                    this.animate();
                });
            }
            
            renderFrame(index) {
                const frame = this.frames[index];
                if (!frame || !this.ctx) return;
                
                // Simple direct canvas draw - much faster than data URL conversion
                try {
                    // Clear canvas
                    this.ctx.fillStyle = '#0a0a0a';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    // Calculate scale to fit canvas
                    const scale = Math.max(
                        this.canvas.width / frame.naturalWidth,
                        this.canvas.height / frame.naturalHeight
                    );
                    
                    const width = frame.naturalWidth * scale;
                    const height = frame.naturalHeight * scale;
                    const x = (this.canvas.width - width) / 2;
                    const y = (this.canvas.height - height) / 2;
                    
                    // Draw frame
                    this.ctx.drawImage(frame, x, y, width, height);
                } catch (e) {
                    console.error('Error rendering frame:', e);
                }
            }
        }
        
        // Initialize player
        const player = new FrameSequencePlayer();
        
        async function startAnimation() {
            console.log('📦 Waiting for frames to load...');
            
            const ready = await player.preloadAllFrames();
            
            if (ready) {
                console.log('✅ All frames ready! Starting playback...');
                player.play();
            } else {
                console.error('❌ No frames loaded. Check:');
                console.error('   1. Frame files exist in the same directory as HTML');
                console.error('   2. Files are named: ezgif-frame-001.jpg to ezgif-frame-179.jpg');
                console.error('   3. Update frameDir if frames are in a subfolder');
            }
        }
        
        // Start when page loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startAnimation);
        } else {
            startAnimation();
        }
    </script>

    <!-- Easter Egg 4-Click Navigation System (Back to Index) -->
    <script>
    (function() {
        'use strict';

        const CONFIG = {
            clicksNeeded: 4,
            targetPage: 'index.html',
            resetDelay: 800,
            fadeOutDuration: 600
        };

        let clickCounter = 0;
        let isNavigating = false;
        let resetTimeout = null;
        const indicator = document.getElementById('clickIndicator');

        /**
         * Preload the target page in background to ensure seamless transition
         */
        function preloadPage() {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = CONFIG.targetPage;
            document.head.appendChild(link);
        }

        /**
         * Update and show the click indicator
         */
        function updateIndicator() {
            indicator.textContent = clickCounter;
            indicator.classList.add('active');
            
            // Hide after short delay if no more clicks - requires continuous/rapid clicking
            clearTimeout(resetTimeout);
            resetTimeout = setTimeout(() => {
                if (clickCounter < CONFIG.clicksNeeded) {
                    indicator.classList.remove('active');
                }
            }, CONFIG.resetDelay);
        }

        /**
         * Navigate to the target page with fade transition
         */
        function navigateToTarget() {
            isNavigating = true;
            document.body.classList.add('fade-out');
            
            setTimeout(() => {
                window.location.href = CONFIG.targetPage;
            }, CONFIG.fadeOutDuration);
        }

        /**
         * Reset the counter
         */
        function resetCounter() {
            clickCounter = 0;
            indicator.classList.remove('active');
            clearTimeout(resetTimeout);
        }

        /**
         * Global click handler - efficient event delegation
         */
        document.addEventListener('click', function() {
            // Prevent multiple rapid navigations
            if (isNavigating) return;

            clickCounter++;
            updateIndicator();

            // Check if target reached
            if (clickCounter === CONFIG.clicksNeeded) {
                navigateToTarget();
            }

            // Reset counter after delay if not enough clicks
            if (resetTimeout) clearTimeout(resetTimeout);
            resetTimeout = setTimeout(resetCounter, CONFIG.resetDelay);
        }, true); // Use capture phase for priority

        // Preload on page load
        window.addEventListener('load', preloadPage);

        // Optional: Reset counter on focus/blur for better UX
        window.addEventListener('blur', resetCounter);
    })();
    </script>

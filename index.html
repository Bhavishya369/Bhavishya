    <!-- Easter Egg 4-Click Navigation System -->
    <script>
    (function() {
        'use strict';

        const CONFIG = {
            clicksNeeded: 4,
            targetPage: 'indexliquidglassversion.html',
            resetDelay: 800,
            fadeOutDuration: 600
        };

        let clickCounter = 0;
        let isNavigating = false;
        let resetTimeout = null;
        const indicator = document.getElementById('clickIndicator');

        /**
         * Preload the target page in background to ensure seamless transition
         */
        function preloadPage() {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = CONFIG.targetPage;
            document.head.appendChild(link);
        }

        /**
         * Update and show the click indicator
         */
        function updateIndicator() {
            indicator.textContent = clickCounter;
            indicator.classList.add('active');
            
            // Hide after short delay if no more clicks - requires continuous/rapid clicking
            clearTimeout(resetTimeout);
            resetTimeout = setTimeout(() => {
                if (clickCounter < CONFIG.clicksNeeded) {
                    indicator.classList.remove('active');
                }
            }, CONFIG.resetDelay);
        }

        /**
         * Navigate to the target page with fade transition
         */
        function navigateToTarget() {
            isNavigating = true;
            document.body.classList.add('fade-out');
            
            setTimeout(() => {
                window.location.href = CONFIG.targetPage;
            }, CONFIG.fadeOutDuration);
        }

        /**
         * Reset the counter
         */
        function resetCounter() {
            clickCounter = 0;
            indicator.classList.remove('active');
            clearTimeout(resetTimeout);
        }

        /**
         * Global click handler - efficient event delegation
         */
        document.addEventListener('click', function() {
            // Prevent multiple rapid navigations
            if (isNavigating) return;

            clickCounter++;
            updateIndicator();

            // Check if target reached
            if (clickCounter === CONFIG.clicksNeeded) {
                navigateToTarget();
            }

            // Reset counter after delay if not enough clicks
            if (resetTimeout) clearTimeout(resetTimeout);
            resetTimeout = setTimeout(resetCounter, CONFIG.resetDelay);
        }, true); // Use capture phase for priority

        // Preload on page load
        window.addEventListener('load', preloadPage);

        // Optional: Reset counter on focus/blur for better UX
        window.addEventListener('blur', resetCounter);
    })();
    </script>

  <!-- Font Awesome and Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    :root.--dark-theme {
      --primary-bg: #0e1112;
      --secondary-bg: #1a1d1e;
      --message-bg: #1f2426;
      --own-message-bg: #2a3b5a;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --accent-color: #7c3aed;
      --accent-hover: #6d28d9;
      --border-color: #2a2f32;
      --header-bg: #1a1d1e;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --online-color: #10b981;
      --typing-color: #3b82f6;
      --reply-bg: rgba(124, 58, 237, 0.15);
      --date-separator: rgba(124, 58, 237, 0.2);
    }
    
    :root.--light-theme {
      --primary-bg: #f5f7fa;
      --secondary-bg: #ffffff;
      --message-bg: #f0f2f5;
      --own-message-bg: #007bff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent-color: #007bff;
      --accent-hover: #0056cc;
      --border-color: #e0e0e0;
      --header-bg: #ffffff;
      --success-color: #28a745;
      --danger-color: #dc3545;
      --online-color: #28a745;
      --typing-color: #007bff;
      --reply-bg: rgba(0, 123, 255, 0.1);
      --date-separator: rgba(0, 123, 255, 0.15);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Lato', sans-serif;
      background: url('login background 123.png') no-repeat center center/cover;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }

    .login-container,
    .verification-box {
      background: rgba(255, 255, 255, 0.2);
      padding: 30px 25px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 350px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .verification-box {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: white;
      padding: 20px;
      border-radius: 15px;
      z-index: 1002;
    }

    .login-container h2 {
      color: white;
      margin-bottom: 20px;
      font-size: 24px;
    }

    label {
      color: white;
      display: block;
      margin-top: 10px;
      text-align: left;
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.9);
    }

    input[type="submit"] {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background-color: #6d28d9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .back-button {
      position: fixed;
      top: 15px;
      left: 15px;
      width: 45px;
      height: 45px;
      cursor: pointer;
      z-index: 1001;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      padding: 10px;
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Chat App Styles */
    #chat-app {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--primary-bg);
      color: var(--text-primary);
      transition: background-color 0.3s, color 0.3s;
      z-index: 1000;
      flex-direction: column;
    }
    
    #chat {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--secondary-bg);
      overflow: hidden;
    }
    
    .chat__header {
      background: var(--header-bg);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      position: relative;
      min-height: 60px;
    }
    
    .header__left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    
    .chat-back-button {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    
    .chat-back-button:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--accent-color);
    }
    
    .chat__avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-color), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 16px;
      flex-shrink: 0;
    }
    
    .chat__title {
      flex: 1;
      min-width: 0;
    }
    
    .chat__title h2 {
      color: var(--text-primary);
      font-weight: 700;
      margin-bottom: 2px;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .chat__title p {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .online-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
    }
    
    .online-dot {
      width: 8px;
      height: 8px;
      background-color: var(--online-color);
      border-radius: 50%;
      animation: pulse 2s infinite;
      flex-shrink: 0;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .chat__actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    
    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--accent-color);
    }
    
    .chat__container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    .chat__sidebar {
      width: 250px;
      border-right: 1px solid var(--border-color);
      padding: 15px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--header-bg);
    }
    
    .sidebar__section {
      margin-bottom: 20px;
    }
    
    .sidebar__title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    
    .user-list {
      list-style: none;
    }
    
    .user-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 8px;
      position: relative;
    }
    
    .user-item:hover, .user-item.active {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      margin-right: 12px;
      font-size: 14px;
      flex-shrink: 0;
    }
    
    .user-info {
      flex: 1;
      min-width: 0;
    }
    
    .user-info h4 {
      font-size: 14px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .user-info p {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .admin-badge {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--danger-color);
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      display: none;
    }
    
    .user-item.admin .admin-badge {
      display: block;
    }
    
    .admin-delete-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--danger-color);
      color: white;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 10px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    
    .admin-visible .admin-delete-btn {
      display: flex;
    }
    
    .chat__main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }
    
    .chat__messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    
    .date-separator {
      text-align: center;
      margin: 15px 0;
      position: relative;
    }
    
    .date-separator span {
      background: var(--date-separator);
      color: var(--text-primary);
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      position: relative;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
      transition: transform 0.2s;
    }
    
    .message:active {
      transform: scale(0.98);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message.received {
      background: var(--message-bg);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    
    .message.sent {
      background: var(--own-message-bg);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    
    .message__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    
    .message__sender {
      font-weight: bold;
      font-size: 13px;
    }
    
    .message__time {
      font-size: 11px;
      opacity: 0.8;
      margin-left: 10px;
    }
    
    .message__content {
      line-height: 1.4;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    
    .message__actions {
      position: absolute;
      top: 6px;
      right: 8px;
      display: none;
      gap: 4px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      padding: 4px;
      backdrop-filter: blur(10px);
    }
    
    .message:hover .message__actions {
      display: flex;
    }
    
    .message-action {
      background: transparent;
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 13px;
    }
    
    .message-action:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .copy-notification {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--secondary-bg);
      color: var(--text-primary);
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      z-index: 2000;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      animation: popIn 0.3s ease;
    }
    
    @keyframes popIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    .copy-notification i {
      color: var(--success-color);
    }
    
    .reply-indicator {
      background: var(--reply-bg);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      border-left: 3px solid var(--accent-color);
      font-size: 13px;
      cursor: pointer;
    }
    
    .reply-sender {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 12px;
    }
    
    .reply-text {
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
      font-size: 12px;
    }
    
    .typing-indicator {
      padding: 8px 15px;
      font-size: 13px;
      color: var(--typing-color);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .typing-dots {
      display: flex;
      gap: 3px;
    }
    
    .typing-dots span {
      width: 6px;
      height: 6px;
      background-color: var(--typing-color);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }
    
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes typing {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    
    .chat__input-area {
      padding: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: var(--header-bg);
    }
    
    .input-wrapper {
      flex: 1;
      display: flex;
      background: var(--message-bg);
      border-radius: 25px;
      padding: 8px 15px;
      align-items: center;
      min-height: 44px;
    }
    
    #chatInput {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      padding: 0;
      outline: none;
      font-family: 'Lato', sans-serif;
      resize: none;
      min-height: 28px;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.4;
    }
    
    #chatInput::placeholder {
      color: var(--text-secondary);
    }
    
    .input-tool {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    
    .input-tool:hover {
      color: var(--accent-color);
      background: rgba(255, 255, 255, 0.05);
    }
    
    #sendBtn {
      background: var(--accent-color);
      border: none;
      color: white;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-size: 18px;
      flex-shrink: 0;
    }
    
    #sendBtn:hover {
      background: var(--accent-hover);
    }
    
    #sendBtn:active {
      transform: scale(0.95);
    }
    
    .emoji-picker {
      position: absolute;
      bottom: 70px;
      right: 12px;
      background: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 15px;
      padding: 12px;
      width: 280px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      z-index: 100;
      display: none;
    }
    
    .emoji-picker.show {
      display: block;
      animation: slideUp 0.2s ease;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .emoji-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .emoji-categories {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    
    .emoji-category {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    
    .emoji-category:hover, .emoji-category.active {
      color: var(--accent-color);
      background: rgba(124, 58, 237, 0.1);
    }
    
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding: 4px;
    }
    
    .emoji-grid::-webkit-scrollbar {
      width: 6px;
    }
    
    .emoji-grid::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .emoji-grid::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    
    .emoji-item {
      font-size: 22px;
      text-align: center;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: background 0.2s;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .emoji-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .theme-switch {
      position: relative;
      display: inline-block;
      width: 56px;
      height: 30px;
      flex-shrink: 0;
    }
    
    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .theme-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #4b5563;
      transition: .4s;
      border-radius: 30px;
    }
    
    .theme-slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .theme-slider {
      background-color: var(--accent-color);
    }
    
    input:checked + .theme-slider:before {
      transform: translateX(26px);
    }
    
    .theme-icons {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      pointer-events: none;
    }
    
    .theme-icons i {
      font-size: 12px;
      color: white;
    }
    
    .notification {
      position: absolute;
      top: 80px;
      right: 20px;
      background: var(--secondary-bg);
      border-left: 4px solid var(--accent-color);
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;

    // Date formatting function (like WhatsApp)
    function formatDateSeparator(timestamp) {
      const messageDate = new Date(timestamp);
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      
      // Reset hours for accurate comparison
      const msgDateOnly = new Date(messageDate.getFullYear(), messageDate.getMonth(), messageDate.getDate());
      const todayOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const yesterdayOnly = new Date(yesterday.getFullYear(), yesterday.getMonth(), yesterday.getDate());
      
      if (msgDateOnly.getTime() === todayOnly.getTime()) {
        return "Today";
      } else if (msgDateOnly.getTime() === yesterdayOnly.getTime()) {
        return "Yesterday";
      } else {
        // Check if within the last 6 days (to show day name)
        const diffDays = Math.floor((todayOnly - msgDateOnly) / (1000 * 60 * 60 * 24));
        if (diffDays < 7) {
          return messageDate.toLocaleDateString('en-US', { weekday: 'long' });
        } else {
          // Check if same year
          if (messageDate.getFullYear() === today.getFullYear()) {
            return messageDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
          } else {
            return messageDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

      }

      // Listen for online users
      db.ref('status').on('value', (snapshot) => {
        const users = snapshot.val() || {};
        onlineUsers = {};
        onlineUsersList.innerHTML = '';
        
        Object.keys(users).forEach(id => {
          const user = users[id];
          if (user && user.online && id !== userId) {
            onlineUsers[id] = user;
            
            // Add to online users list
            const li = document.createElement('li');
            li.className = `user-item ${user.isAdmin ? 'admin' : ''}`;
            li.innerHTML = `
              <div class="user-avatar">${user.username.charAt(0).toUpperCase()}</div>
              <div class="user-info">
                <h4>${user.username}</h4>
                <p>Online now</p>
              </div>
              ${user.isAdmin ? '<span class="admin-badge">Admin</span>' : ''}
              ${isAdmin ? '<button class="admin-delete-btn" title="Remove User"><i class="fas fa-times"></i></button>' : ''}
            `;
            
            if (isAdmin) {
              li.classList.add('admin-visible');
              const deleteBtn = li.querySelector('.admin-delete-btn');
              deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm(`Remove ${user.username} from chat?`)) {
                  // Remove all messages from this user
                  db.ref('chat').orderByChild('userId').equalTo(id).once('value', (snap) => {
                    const messages = snap.val();
                    if (messages) {
                      Object.keys(messages).forEach(key => {
                        db.ref(`chat/${key}`).remove();
                      });
                    }
                  });
                  
                  // Remove user from status
                  db.ref(`status/${id}`).remove();
                }
              });
            }
            
            onlineUsersList.appendChild(li);
          }
        });
        
        // Update online count
        const count = Object.keys(onlineUsers).length + 1; // +1 for current user
        onlineCount.textContent = `${count} online`;
      });

      // Load recent chats
      function loadRecentChats() {
        db.ref('chat').limitToLast(20).once('value', (snapshot) => {
          const messages = snapshot.val() || {};
          recentChatUsers = {};
          
          // Get unique users from recent messages
          Object.values(messages).forEach(msg => {
            if (msg && msg.name !== username) {
              recentChatUsers[msg.userId] = { name: msg.name, userId: msg.userId };
            }
          });
          
          // Populate recent chats list
          recentChatsList.innerHTML = '';
          Object.values(recentChatUsers).forEach(user => {
            const li = document.createElement('li');
            li.className = `user-item`;
            li.innerHTML = `
              <div class="user-avatar">${user.name.charAt(0).toUpperCase()}</div>
              <div class="user-info">
                <h4>${user.name}</h4>
                <p>Recent chat</p>
              </div>
              ${isAdmin ? '<button class="admin-delete-btn" title="Delete User Chat"><i class="fas fa-trash"></i></button>' : ''}
            `;
            
            if (isAdmin) {
              li.classList.add('admin-visible');
              const deleteBtn = li.querySelector('.admin-delete-btn');
              deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (confirm(`Delete all messages from ${user.name}?`)) {
                  db.ref('chat').orderByChild('userId').equalTo(user.userId).once('value', (snap) => {
                    const messages = snap.val();
                    if (messages) {
                      Object.keys(messages).forEach(key => {
                        db.ref(`chat/${key}`).remove();
                      });
                    }
                  });
                }
              });
            }
            
            recentChatsList.appendChild(li);
          });
        });
      }

      // Send message
      function sendMessage() {
        if (isSending) return; // Prevent duplicate sending
        isSending = true;
        
        let text = chatInput.value.trim();
        
        // Handle /clear chat command
        if (text === '/clear chat') {
          if (confirm('Clear all messages from Firebase? This cannot be undone.')) {
            db.ref('chat').remove()
              .then(() => {
                chatInput.value = '';
                autoResizeTextarea();
                showNotification('All messages cleared!');
                isSending = false;
              })
              .catch(error => {
                console.error("Error clearing chat:", error);
                showNotification('Failed to clear chat', true);
                isSending = false;
              });
          } else {
            isSending = false;
          }
          return;
        }
        
        if (!text) {
          isSending = false;
          return;
        }
        
        const timestamp = Date.now();
        const message = {
          id: `msg_${timestamp}_${userId}`,
          name: username,
          userId: userId,
          text: text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          timestamp: timestamp,
          edited: false,
          replyTo: replyToMessage ? {
            id: replyToMessage.id,
            sender: replyToMessage.name,
            text: replyToMessage.text
          } : null
        };
        
        db.ref('chat').push(message)
          .then(() => {
            chatInput.value = '';
            replyToMessage = null;
            autoResizeTextarea();
            updateTypingStatus(false);
            
            // Scroll to bottom
            setTimeout(() => {
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 100);
            
            isSending = false; // Reset sending flag
          })
          .catch(error => {
            console.error("Error sending message:", error);
            alert("Failed to send message. Please try again.");
            isSending = false; // Reset sending flag
          });
      }

      // Remove previous message listener if exists to prevent duplicates
      if (messageListener) {
        messageListener.off();
      }

      // Listen for new messages (with single listener)
      messageListener = db.ref('chat').limitToLast(100);
      messageListener.on('child_added', (snapshot) => {
        const msg = snapshot.val();
        const key = snapshot.key;
        
        if (!msg) return;
        
        // Check if message already exists
        if (document.querySelector(`[data-id="${msg.id}"]`)) return;
        
        // Check if we need to add a date separator
        const messageDate = formatDateSeparator(msg.timestamp || Date.now());
        if (messageDate !== lastDateSeparator) {
          lastDateSeparator = messageDate;
          const dateSeparator = document.createElement('div');
          dateSeparator.className = 'date-separator';
          dateSeparator.innerHTML = `<span>${messageDate}</span>`;
          messagesDiv.appendChild(dateSeparator);
        }
        
        const isOwnMessage = msg.userId === userId;
        const canEditDelete = isOwnMessage || isAdmin || (msg.name === username && localStorage.getItem(`chat_userId_${msg.name}`) === msg.userId);
        
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isOwnMessage ? 'sent' : 'received'}`;
        messageDiv.dataset.id = msg.id;
        messageDiv.dataset.key = key;
        
        const editedText = msg.edited ? ' (edited)' : '';
        
        let replyHtml = '';
        if (msg.replyTo) {
          replyHtml = `
            <div class="reply-indicator" onclick="scrollToMessage('${msg.replyTo.id}')">
              <div class="reply-sender">↩ ${msg.replyTo.sender}</div>
              <div class="reply-text">${msg.replyTo.text}</div>
            </div>
          `;
        }
        
        // Always show reply and copy buttons for all messages
        let messageActionsHTML = `
          <button class="message-action copy-btn" title="Copy Message">
            <i class="fas fa-copy"></i>
          </button>
          <button class="message-action reply-btn" title="Reply">
            <i class="fas fa-reply"></i>
          </button>
        `;
        
        // Show edit/delete buttons based on permissions
        if (canEditDelete) {
          messageActionsHTML += `
            <button class="message-action edit-btn" title="Edit">
              <i class="fas fa-edit"></i>
            </button>
            <button class="message-action delete-btn" title="Delete">
              <i class="fas fa-trash"></i>
            </button>
          `;
        } else if (isAdmin) {
          // Admin can delete any message
          messageActionsHTML += `
            <button class="message-action delete-btn" title="Delete (Admin)">
              <i class="fas fa-trash"></i>
            </button>
          `;
        }
        
        messageDiv.innerHTML = `
          ${replyHtml}
          <div class="message__header">
            <span class="message__sender">${msg.name}</span>
            <span class="message__time">${msg.time}</span>
          </div>
          <div class="message__content">${msg.text}${editedText}</div>
          <div class="message__actions">
            ${messageActionsHTML}
          </div>
        `;
        
        messagesDiv.appendChild(messageDiv);
        
        // Store message reference
        currentMessages[key] = messageDiv;
        
        // Scroll to bottom if new message is from current user or if at bottom
        if (isOwnMessage || messagesDiv.scrollHeight - messagesDiv.scrollTop - messagesDiv.clientHeight < 100) {
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Load recent chats when new message arrives
        loadRecentChats();
      });

      // Listen for message updates (for editing)
      db.ref('chat').on('child_changed', (snapshot) => {
        const msg = snapshot.val();
        const key = snapshot.key;
        
        if (!msg) return;
        
        const messageDiv = document.querySelector(`[data-key="${key}"]`);
        if (messageDiv) {
          const contentDiv = messageDiv.querySelector('.message__content');
          const editedText = msg.edited ? ' (edited)' : '';
          contentDiv.textContent = msg.text + editedText;
          
          const timeSpan = messageDiv.querySelector('.message__time');
          if (timeSpan) {
            timeSpan.textContent = msg.time;
          }
        }
      });

      // Listen for message deletions
      db.ref('chat').on('child_removed', (snapshot) => {
        const key = snapshot.key;
        const messageDiv = document.querySelector(`[data-key="${key}"]`);
        if (messageDiv) {
          messageDiv.remove();
          delete currentMessages[key];
        }
      });

      // Edit message
      function editMessage(key, messageDiv) {
        const contentDiv = messageDiv.querySelector('.message__content');
        // Remove "(edited)" text if present
        let originalText = contentDiv.textContent;
        if (originalText.includes(' (edited)')) {
          originalText = originalText.replace(' (edited)', '');
        }
        
        const newText = prompt('Edit your message:', originalText.trim());
        if (newText && newText !== originalText.trim()) {
          const updates = {
            text: newText,
            edited: true,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          
          // Update the message in Firebase
          db.ref(`chat/${key}`).update(updates)
            .then(() => {
              console.log("Message edited successfully");
            })
            .catch(error => {
              console.error("Error editing message:", error);
              alert("Failed to edit message. Please try again.");
            });
        }
      }

      // Delete message
      function deleteMessage(key) {
        if (confirm('Are you sure you want to delete this message?')) {
          db.ref(`chat/${key}`).remove()
            .then(() => {
              console.log("Message deleted successfully");
            })
            .catch(error => {
              console.error("Error deleting message:", error);
              alert("Failed to delete message. Please try again.");
            });
        }
      }

      // Reply to message
      function replyToMessageFunc(key, messageDiv) {
        const sender = messageDiv.querySelector('.message__sender').textContent;
        const content = messageDiv.querySelector('.message__content').textContent;
        
        // Find the original message data
        db.ref(`chat/${key}`).once('value').then((snapshot) => {
          const msg = snapshot.val();
          if (msg) {
            replyToMessage = {
              id: msg.id,
              name: msg.name,
              text: msg.text
            };
            
            chatInput.value = `Replying to ${sender}: `;
            chatInput.focus();
            autoResizeTextarea();
            showNotification(`Replying to ${sender}`);
          }
        });
      }

      // Copy message
      function copyMessage(messageDiv) {
        const contentDiv = messageDiv.querySelector('.message__content');
        const sender = messageDiv.querySelector('.message__sender').textContent;
        const time = messageDiv.querySelector('.message__time').textContent;
        let text = contentDiv.textContent;
        
        // Remove "(edited)" text if present
        if (text.includes(' (edited)')) {
          text = text.replace(' (edited)', '');
        }
        
        copyToClipboard(text);
      }

      // Message action handlers
      messagesDiv.addEventListener('click', (e) => {
        if (e.target.closest('.copy-btn')) {
          e.stopPropagation();
          const messageDiv = e.target.closest('.message');
          copyMessage(messageDiv);
        } else if (e.target.closest('.reply-btn')) {
          e.stopPropagation();
          const messageDiv = e.target.closest('.message');
          const key = messageDiv.dataset.key;
          replyToMessageFunc(key, messageDiv);
        } else if (e.target.closest('.edit-btn')) {
          e.stopPropagation();
          const messageDiv = e.target.closest('.message');
          const key = messageDiv.dataset.key;
          editMessage(key, messageDiv);
        } else if (e.target.closest('.delete-btn')) {
          e.stopPropagation();
          const messageDiv = e.target.closest('.message');
          const key = messageDiv.dataset.key;
          deleteMessage(key);
        }
      });

      // Send message on Enter key (Shift+Enter for new line)
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Send message on button click
      sendBtn.addEventListener('click', sendMessage);

      // Search functionality
      searchBtn.addEventListener('click', () => {
        const searchTerm = prompt('Search for messages:');
        if (searchTerm) {
          const messages = document.querySelectorAll('.message');
          messages.forEach(msg => {
            const content = msg.querySelector('.message__content').textContent.toLowerCase();
            if (content.includes(searchTerm.toLowerCase())) {
              msg.style.backgroundColor = 'rgba(124, 58, 237, 0.3)';
              msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
              msg.style.backgroundColor = '';
            }
          });
        }
      });

      // Menu button functionality
      menuBtn.addEventListener('click', () => {
        const menuOptions = ['Clear Chat', 'Change Username', 'Admin Login', 'Export Chat', 'Settings'];
        const selected = prompt(`Menu Options:\n${menuOptions.map((opt, i) => `${i+1}. ${opt}`).join('\n')}\n\nEnter option number:`);
        
        if (selected) {
          const optionIndex = parseInt(selected) - 1;
          if (optionIndex >= 0 && optionIndex < menuOptions.length) {
            switch(menuOptions[optionIndex]) {
              case 'Clear Chat':
                if (confirm('Clear all messages from Firebase? This cannot be undone.')) {
                  db.ref('chat').remove()
                    .then(() => {
                      showNotification('All messages cleared!');
                    })
                    .catch(error => {
                      console.error("Error clearing chat:", error);
                      showNotification('Failed to clear chat', true);
                    });
                }
                break;
              case 'Change Username':
                const newName = prompt('Enter new username:', username);
                if (newName && newName.trim() !== '') {
                  const newUsername = newName.trim();
                  const oldUserId = userId;
                  
                  // Generate new userId or use existing one for this username
                  const storedUserId = localStorage.getItem(`chat_userId_${newUsername}`);
                  if (storedUserId) {
                    userId = storedUserId;
                  } else {
                    userId = `user_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    localStorage.setItem(`chat_userId_${newUsername}`, userId);
                  }
                  
                  username = newUsername;
                  localStorage.setItem('chat_username', username);
                  userAvatar.textContent = username.charAt(0).toUpperCase();
                  
                  // Update presence with new user info
                  db.ref(`status/${oldUserId}`).remove();
                  updateUserPresence(true);
                  
                  // Update all messages from old userId to new userId
                  db.ref('chat').orderByChild('userId').equalTo(oldUserId).once('value', (snapshot) => {
                    const updates = {};
                    snapshot.forEach((childSnap) => {
                      updates[`${childSnap.key}/userId`] = userId;
                      updates[`${childSnap.key}/name`] = username;
                    });
                    
                    if (Object.keys(updates).length > 0) {
                      db.ref('chat').update(updates);
                    }
                  });
                  
                  showNotification('Username updated!');
                }
                break;
              case 'Admin Login':
                const password = prompt('Enter admin password:');
                if (password === 'fafa123') {
                  isAdmin = true;
                  localStorage.setItem('chat_admin', 'true');
                  updateUserPresence(true);
                  showNotification('Admin privileges granted!');
                  loadRecentChats(); // Reload to show admin controls
                  
                  // Reload messages to show admin delete buttons
                  setTimeout(() => {
                    messagesDiv.innerHTML = '';
                    lastDateSeparator = '';
                    const welcomeMsg = document.createElement('div');
                    welcomeMsg.className = 'message welcome received';
                    welcomeMsg.innerHTML = `
                      <div class="message__header">
                        <span class="message__sender">System</span>
                      </div>
                      <div class="message__content">
                        Admin privileges activated! You can now delete any message.
                      </div>
                    `;
                    messagesDiv.appendChild(welcomeMsg);
                  }, 100);
                } else {
                  alert('Invalid password!');
                }
                break;
              case 'Export Chat':
                const allMessages = Array.from(document.querySelectorAll('.message'))
                  .map(msg => {
                    const sender = msg.querySelector('.message__sender').textContent;
                    const time = msg.querySelector('.message__time').textContent;
                    const content = msg.querySelector('.message__content').textContent;
                    return `${time} - ${sender}: ${content}`;
                  })
                  .join('\n');
                
                const blob = new Blob([allMessages], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `chat_export_${new Date().toISOString().split('T')[0]}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                break;
              case 'Settings':
                alert('Settings: Theme toggle available in top-right corner.');
                break;
            }
          }
        }
      });

      // Attach button functionality
      attachBtn.addEventListener('click', () => {
        alert('File attachment feature coming soon!');
      });

      // Back to login function
      function backToLogin() {
        updateUserPresence(false);
        if (messageListener) {
          messageListener.off();
          messageListener = null;
        }
        document.getElementById("chat-app").style.display = "none";
        document.querySelector(".login-container").style.display = "block";
        document.querySelector(".back-button").style.display = "block";
      }

      // Add back button functionality
      chatBackBtn.addEventListener('click', backToLogin);

      // Show notification
      function showNotification(message, isError = false) {
        const notification = document.createElement('div');
        notification.className = 'notification';
        notification.style.borderLeftColor = isError ? 'var(--danger-color)' : 'var(--accent-color)';
        notification.innerHTML = `
          <div class="notification-icon">
            <i class="fas fa-${isError ? 'exclamation-circle' : 'check-circle'}"></i>
          </div>
          <div class="notification-content">
            <p>${message}</p>
          </div>
        `;
        document.getElementById('chat-app').appendChild(notification);
        
        setTimeout(() => {
          notification.remove();
        }, 3000);
      }

      // Scroll to message function (for reply indicators)
      window.scrollToMessage = function(messageId) {
        const messageDiv = document.querySelector(`[data-id="${messageId}"]`);
        if (messageDiv) {
          messageDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
          messageDiv.style.backgroundColor = 'rgba(124, 58, 237, 0.3)';
          setTimeout(() => {
            messageDiv.style.backgroundColor = '';
          }, 2000);
        }
      };

      // Initialize the app
      function initApp() {
        initEmojiPicker();
        updateUserPresence(true);
        loadRecentChats();
        
        // Hide login back button when in chat
        document.querySelector(".back-button").style.display = "none";
        
        // Show welcome notification
        setTimeout(() => {
          showNotification(`Welcome ${username}! You're now online.`);
        }, 1000);
        
        // Listen for window close/refresh to set offline
        window.addEventListener('beforeunload', () => {
          updateUserPresence(false);
        });
      }

      // Start the app
      initApp();
    }

    window.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("login-form");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
          robo_id: document.getElementById("robo-id").value,
          neuralink_no: document.getElementById("neuralink-no").value,
          teleportation_id: document.getElementById("teleportation-id").value
        };

        await checkSecretAndProceed(data);
      });
    });
  </script>
</body>
</html>

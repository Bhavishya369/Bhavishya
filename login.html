<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEON CITY — Open World</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial}
canvas{display:block}

#hud{
 position:fixed;top:18px;left:18px;
 color:white;z-index:5;
 text-shadow:0 2px 5px #000;
 pointer-events:none
}
#title{font-size:24px;font-weight:900;letter-spacing:3px}
#money{color:#55ff9a;font-size:18px;margin-top:8px}

#mission{
 position:fixed;top:20px;right:20px;
 padding:14px 18px;
 color:white;background:#080b12cc;
 border:1px solid #ffffff25;
 border-radius:12px;
 backdrop-filter:blur(12px);
 z-index:5
}

#help{
 position:fixed;bottom:20px;left:20px;
 color:#ddd;background:#080b12bb;
 padding:10px 14px;border-radius:10px;
 z-index:5
}

#crosshair{
 position:fixed;left:50%;top:50%;
 width:8px;height:8px;
 border:1px solid white;border-radius:50%;
 transform:translate(-50%,-50%);
 z-index:4
}
</style>
</head>

<body>

<div id="hud">
  <div id="title">NEON CITY</div>
  <div id="money">$2,500</div>
</div>

<div id="mission">
  <b>MISSION</b><br>
  Reach the blue marker
</div>

<div id="help">
  WASD — Move &nbsp; | &nbsp; Mouse — Look &nbsp; | &nbsp; E — Enter car
</div>

<div id="crosshair"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

import {OrbitControls} from
"https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js";


// --------------------------------------------------
// SCENE
// --------------------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x07101c);

scene.fog = new THREE.FogExp2(
    0x07101c,
    0.009
);


// --------------------------------------------------
// CAMERA
// --------------------------------------------------

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    0.1,
    1000
);

camera.position.set(10,8,14);


// --------------------------------------------------
// RENDERER
// --------------------------------------------------

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


// --------------------------------------------------
// LIGHTING
// --------------------------------------------------

const hemi = new THREE.HemisphereLight(
    0x9fc8ff,
    0x151515,
    2
);

scene.add(hemi);


const sun = new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    80,120,40
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-150;
sun.shadow.camera.right=150;
sun.shadow.camera.top=150;
sun.shadow.camera.bottom=-150;

scene.add(sun);


// --------------------------------------------------
// GROUND
// --------------------------------------------------

const groundGeo =
new THREE.PlaneGeometry(
    500,500
);

const groundMat =
new THREE.MeshStandardMaterial({
    color:0x15191f,
    roughness:.85
});

const ground =
new THREE.Mesh(
    groundGeo,
    groundMat
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


// --------------------------------------------------
// ROAD SYSTEM
// --------------------------------------------------

const roadMat =
new THREE.MeshStandardMaterial({
    color:0x24272c,
    roughness:.8
});

function road(x,z,w,d){

    const geo =
    new THREE.BoxGeometry(
        w,.05,d
    );

    const r =
    new THREE.Mesh(
        geo,
        roadMat
    );

    r.position.set(x,.02,z);
    r.receiveShadow=true;

    scene.add(r);


    // lane markings

    const lineMat =
    new THREE.MeshBasicMaterial({
        color:0xf5d76e
    });

    if(w>d){

        for(let i=-w/2;i<w/2;i+=6){

            const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    3,.06,.12
                ),
                lineMat
            );

            line.position.set(
                x+i,.06,z
            );

            scene.add(line);
        }

    }else{

        for(let i=-d/2;i<d/2;i+=6){

            const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .12,.06,3
                ),
                lineMat
            );

            line.position.set(
                x,.06,z+i
            );

            scene.add(line);
        }
    }
}

road(0,0,18,500);
road(0,0,500,18);

road(100,0,14,500);
road(-100,0,14,500);

road(0,100,500,14);
road(0,-100,500,14);


// --------------------------------------------------
// BUILDINGS
// --------------------------------------------------

function building(x,z){

    const width =
    12+Math.random()*14;

    const depth =
    12+Math.random()*14;

    const height =
    15+Math.random()*55;

    const colors=[
        0x29313d,
        0x323944,
        0x202731,
        0x3a3f48,
        0x252d38
    ];

    const mat =
    new THREE.MeshStandardMaterial({
        color:
        colors[
        Math.floor(
        Math.random()*colors.length
        )],
        roughness:.7,
        metalness:.15
    });

    const mesh =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        mat
    );

    mesh.position.set(
        x,
        height/2,
        z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);


    // rooftop

    const roof =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width+.3,
            .3,
            depth+.3
        ),
        new THREE.MeshStandardMaterial({
            color:0x11151b
        })
    );

    roof.position.set(
        x,height+.15,z
    );

    scene.add(roof);


    // glowing windows

    const windowMat =
    new THREE.MeshBasicMaterial({
        color:
        Math.random()>.5
        ?0xffc857
        :0x7ac7ff
    });

    for(
        let y=5;
        y<height-3;
        y+=5
    ){

        for(
            let xx=-width/2+2;
            xx<width/2-1;
            xx+=4
        ){

            if(Math.random()<.65){

                const win =
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        1.4,2
                    ),
                    windowMat
                );

                win.position.set(
                    x+xx,
                    y,
                    z-depth/2-.02
                );

                scene.add(win);
            }
        }
    }
}


// city grid

for(let x=-180;x<=180;x+=30){

    for(let z=-180;z<=180;z+=30){

        // leave roads clear

        if(
            Math.abs(x)<14 ||
            Math.abs(z)<14 ||
            Math.abs(x-100)<11 ||
            Math.abs(x+100)<11 ||
            Math.abs(z-100)<11 ||
            Math.abs(z+100)<11
        ) continue;

        building(
            x+(Math.random()*6-3),
            z+(Math.random()*6-3)
        );
    }
}


// --------------------------------------------------
// CAR
// --------------------------------------------------

function createCar(){

    const car =
    new THREE.Group();


    const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            3.8,1,7
        ),
        new THREE.MeshStandardMaterial({
            color:0x146cff,
            metalness:.65,
            roughness:.25
        })
    );

    body.position.y=.8;

    body.castShadow=true;

    car.add(body);


    const cabin =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.7,1.1,3
        ),
        new THREE.MeshStandardMaterial({
            color:0x111722,
            metalness:.4,
            roughness:.15
        })
    );

    cabin.position.set(
        0,1.55,-.2
    );

    cabin.castShadow=true;

    car.add(cabin);


    // wheels

    const wheelMat =
    new THREE.MeshStandardMaterial({
        color:0x080808,
        roughness:.9
    });

    for(const x of [-1.9,1.9]){

        for(const z of [-2.2,2.2]){

            const wheel =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .65,.65,.4,24
                ),
                wheelMat
            );

            wheel.rotation.z=
            Math.PI/2;

            wheel.position.set(
                x,.55,z
            );

            wheel.castShadow=true;

            car.add(wheel);
        }
    }

    return car;
}


const playerCar =
createCar();

playerCar.position.set(
    10,.1,10
);

scene.add(playerCar);


// --------------------------------------------------
// PLAYER
// --------------------------------------------------

const player =
new THREE.Group();


const body =
new THREE.Mesh(
    new THREE.CapsuleGeometry(
        .45,1.1,4,8
    ),
    new THREE.MeshStandardMaterial({
        color:0xe8b18b
    })
);

body.position.y=1.2;

body.castShadow=true;

player.add(body);


const shirt =
new THREE.Mesh(
    new THREE.CylinderGeometry(
        .5,.5,.9,12
    ),
    new THREE.MeshStandardMaterial({
        color:0x202c45
    })
);

shirt.position.y=.85;

shirt.castShadow=true;

player.add(shirt);


player.position.set(
    0,0,8
);

scene.add(player);


// --------------------------------------------------
// MISSION MARKER
// --------------------------------------------------

const marker =
new THREE.Mesh(
    new THREE.CylinderGeometry(
        5,5,.15,48
    ),
    new THREE.MeshBasicMaterial({
        color:0x00aaff,
        transparent:true,
        opacity:.55
    })
);

marker.position.set(
    75,.1,75
);

scene.add(marker);


// --------------------------------------------------
// CONTROLS
// --------------------------------------------------

const keys={};

addEventListener(
    "keydown",
    e=>keys[e.key.toLowerCase()]=true
);

addEventListener(
    "keyup",
    e=>keys[e.key.toLowerCase()]=false
);


// --------------------------------------------------
// CAMERA
// --------------------------------------------------

let yaw=0;
let pitch=.25;

document.body.addEventListener(
    "click",
    ()=>{
        document.body.requestPointerLock();
    }
);

document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement
            !==document.body
        ) return;

        yaw-=e.movementX*.002;
        pitch-=e.movementY*.002;

        pitch=
        Math.max(
            -.3,
            Math.min(.8,pitch)
        );
    }
);


// --------------------------------------------------
// GAME LOOP
// --------------------------------------------------

const clock =
new THREE.Clock();

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt =
    Math.min(
        clock.getDelta(),
        .05
    );


    // player movement

    const speed =
    keys["shift"]
    ?8
    :4;


    const forward =
    new THREE.Vector3(
        Math.sin(yaw),
        0,
        Math.cos(yaw)
    );

    const right =
    new THREE.Vector3(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
    );


    if(keys["w"])
        player.position.addScaledVector(
            forward,
            -speed*dt
        );

    if(keys["s"])
        player.position.addScaledVector(
            forward,
            speed*dt
        );

    if(keys["a"])
        player.position.addScaledVector(
            right,
            -speed*dt
        );

    if(keys["d"])
        player.position.addScaledVector(
            right,
            speed*dt
        );


    // rotate player

    player.rotation.y=yaw;


    // camera follow

    const camDistance=9;

    const target =
    new THREE.Vector3(
        player.position.x,
        player.position.y+1.3,
        player.position.z
    );

    const camOffset =
    new THREE.Vector3(
        Math.sin(yaw)*camDistance,
        4+pitch*4,
        Math.cos(yaw)*camDistance
    );

    camera.position.lerp(
        target.clone().add(camOffset),
        .12
    );

    camera.lookAt(target);


    // mission distance

    const distance =
    player.position.distanceTo(
        marker.position
    );

    document.getElementById(
        "mission"
    ).innerHTML =
    `<b>MISSION</b><br>`+
    `Reach the blue marker<br>`+
    `<small>${Math.round(distance)}m away</small>`;


    if(distance<6){

        document.getElementById(
            "mission"
        ).innerHTML=
        `<b>MISSION COMPLETE ✓</b><br>`+
        `+$500`;

        marker.visible=false;
    }


    // animate marker

    marker.rotation.y+=dt;

    marker.position.y=
    .1+
    Math.sin(
        performance.now()*.003
    )*.1;


    renderer.render(
        scene,
        camera
    );
}

animate();


// --------------------------------------------------
// RESIZE
// --------------------------------------------------

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
</body>
</html>
